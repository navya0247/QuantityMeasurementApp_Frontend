<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Measurement — QMeasure</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --accent:#0ea5e9;--accent-dk:#0284c7;--accent-lt:#38bdf8;
            --coral:#f97316;--coral-dk:#ea580c;
            --green:#10b981;--purple:#8b5cf6;--red:#ef4444;--warning:#f59e0b;
            --text:#0c1a2e;--muted:#334155;--dim:#64748b;
            --border:rgba(14,165,233,0.15);--radius:12px;--tr:all 0.25s ease;
        }
        html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;color:var(--text);}
        body{background:linear-gradient(135deg,#e0f2fe 0%,#f0fdf4 50%,#fef9c3 100%);}
        body::before{
            content:'';position:fixed;inset:0;
            background:
                radial-gradient(ellipse at 15% 25%,rgba(14,165,233,0.1) 0%,transparent 45%),
                radial-gradient(ellipse at 85% 75%,rgba(249,115,22,0.08) 0%,transparent 45%);
            z-index:0;
        }
        .layout{display:flex;height:100vh;position:relative;z-index:1;}

        /* ── Sidebar ── */
        .sidebar{
            width:190px;flex-shrink:0;
            background:rgba(255,255,255,0.78);
            backdrop-filter:blur(20px);
            border-right:1px solid var(--border);
            padding:18px 12px;
            display:flex;flex-direction:column;gap:4px;
        }
        .sb-logo{
            display:flex;align-items:center;gap:8px;
            padding:4px 8px 14px;
            border-bottom:1px solid var(--border);margin-bottom:4px;
        }
        .sb-logo-icon{
            width:28px;height:28px;
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            border-radius:7px;
            display:flex;align-items:center;justify-content:center;
            font-size:12px;color:#fff;
        }
        .sb-logo-txt{font-size:14px;font-weight:700;color:var(--text);}
        .s-item{
            display:flex;align-items:center;gap:8px;
            padding:8px 10px;border-radius:8px;
            font-size:12px;font-weight:500;color:var(--muted);
            cursor:pointer;transition:var(--tr);text-decoration:none;
            border:1px solid transparent;
        }
        .s-item:hover{background:rgba(14,165,233,0.08);color:var(--accent-dk);}
        .s-item.active{background:rgba(14,165,233,0.1);color:var(--accent-dk);font-weight:700;border-color:var(--border);}
        .s-item i{font-size:12px;width:13px;text-align:center;}
        .s-div{height:1px;background:var(--border);margin:5px 0;}
        .s-bottom{margin-top:auto;}
        .user-card{
            background:rgba(14,165,233,0.06);
            border:1px solid var(--border);
            border-radius:10px;padding:10px;
            display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
        }
        .u-avatar{
            width:36px;height:36px;
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            font-size:14px;font-weight:700;color:#fff;
            box-shadow:0 3px 8px rgba(14,165,233,0.3);
        }
        .u-name{font-size:12px;font-weight:700;color:var(--text);}
        .u-role{font-size:10px;color:var(--dim);font-weight:500;}
        .u-badge{
            font-size:10px;
            background:rgba(16,185,129,0.1);color:var(--green);
            border:1px solid rgba(16,185,129,0.25);
            border-radius:20px;padding:2px 10px;font-weight:700;
        }
        .logout-btn{
            width:100%;margin-top:3px;padding:6px;
            background:rgba(239,68,68,0.06);color:#ef4444;
            border:1px solid rgba(239,68,68,0.2);
            border-radius:7px;font-family:'DM Sans',sans-serif;
            font-size:11px;font-weight:700;cursor:pointer;transition:var(--tr);
            display:flex;align-items:center;justify-content:center;gap:5px;
        }
        .logout-btn:hover{background:#ef4444;color:#fff;}

        /* ── Content ── */
        .content{
            flex:1;
            display:grid;
            grid-template-rows:auto auto 1fr;
            gap:10px;
            padding:14px 16px;
            min-width:0;overflow:hidden;
        }

        /* Header */
        .pg-hdr h1{font-size:17px;font-weight:700;}
        .pg-hdr h1 span{color:var(--accent-dk);}
        .pg-hdr p{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}

        /* ── Type row — same style as action buttons, sits above ── */
        .type-row{
            display:flex;gap:6px;
            background:rgba(255,255,255,0.7);
            backdrop-filter:blur(10px);
            border:1px solid rgba(14,165,233,0.15);
            border-radius:var(--radius);
            padding:8px;
        }
        .type-btn{
            flex:1;padding:8px 6px;
            background:transparent;
            border:1.5px solid transparent;
            border-radius:9px;
            display:flex;align-items:center;justify-content:center;gap:6px;
            cursor:pointer;transition:var(--tr);
            font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);
        }
        .type-btn:hover{background:rgba(14,165,233,0.06);color:var(--accent-dk);border-color:rgba(14,165,233,0.2);}
        .type-btn.active{
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            color:#fff;border-color:var(--accent);
            box-shadow:0 3px 10px rgba(14,165,233,0.3);
        }
        .type-btn i{font-size:14px;}
        .type-btn.active i{color:#fff;}
        #type-LENGTH i{color:#0284c7;}
        #type-WEIGHT i{color:var(--coral);}
        #type-VOLUME i{color:var(--green);}
        #type-TEMPERATURE i{color:var(--purple);}
        .type-btn.active#type-WEIGHT i,
        .type-btn.active#type-VOLUME i,
        .type-btn.active#type-TEMPERATURE i{color:#fff;}

        /* ── Main grid — left form | right history ── */
        .main-grid{
            display:grid;
            grid-template-columns:1fr 270px;
            gap:10px;
            min-height:0;
        }

        /* ── Left column ── */
        .left-col{display:flex;flex-direction:column;gap:8px;min-height:0;}

        /* Action section */
        .action-section{
            background:rgba(255,255,255,0.8);
            backdrop-filter:blur(10px);
            border:1px solid rgba(14,165,233,0.15);
            border-radius:var(--radius);
            padding:10px 12px;
        }
        .action-lbl{
            font-size:10px;font-weight:700;color:var(--dim);
            text-transform:uppercase;letter-spacing:0.7px;margin-bottom:7px;
        }

        /* Action buttons row — Compare | Convert | Arithmetic (inline expand) */
        .action-row{display:flex;gap:6px;}
        .a-btn{
            flex:1;padding:9px 8px;
            background:rgba(255,255,255,0.9);
            border:1.5px solid rgba(14,165,233,0.15);
            border-radius:9px;
            font-family:'DM Sans',sans-serif;
            font-size:12px;font-weight:600;color:var(--muted);
            cursor:pointer;transition:var(--tr);
            display:flex;align-items:center;justify-content:center;gap:5px;
        }
        .a-btn:hover{border-color:var(--accent);color:var(--accent-dk);background:rgba(14,165,233,0.06);}
        .a-btn.active{
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            border-color:var(--accent);color:#fff;
            box-shadow:0 3px 10px rgba(14,165,233,0.3);
        }
        .a-btn:disabled{opacity:0.3;cursor:not-allowed;}

        /* Arithmetic toggle button */
        .arith-toggle{
            flex:1;padding:9px 8px;
            background:rgba(249,115,22,0.07);
            border:1.5px solid rgba(249,115,22,0.2);
            border-radius:9px;
            font-family:'DM Sans',sans-serif;
            font-size:12px;font-weight:600;color:var(--coral);
            cursor:pointer;transition:var(--tr);
            display:flex;align-items:center;justify-content:center;gap:5px;
        }
        .arith-toggle:hover{background:rgba(249,115,22,0.12);}
        .arith-toggle.active-group{
            background:linear-gradient(135deg,var(--coral),var(--coral-dk));
            color:#fff;border-color:var(--coral);
            box-shadow:0 3px 10px rgba(249,115,22,0.3);
        }

        /* Arithmetic sub-buttons — INLINE, expand below in same section */
        .arith-sub{
            display:flex;gap:6px;
            max-height:0;overflow:hidden;
            transition:max-height 0.3s ease, margin-top 0.3s ease, opacity 0.3s ease;
            opacity:0;margin-top:0;
        }
        .arith-sub.open{max-height:60px;opacity:1;margin-top:7px;}
        .arith-btn{
            flex:1;padding:8px 8px;
            background:rgba(249,115,22,0.06);
            border:1.5px solid rgba(249,115,22,0.18);
            border-radius:8px;
            font-family:'DM Sans',sans-serif;
            font-size:12px;font-weight:600;color:var(--coral);
            cursor:pointer;transition:var(--tr);
            display:flex;align-items:center;justify-content:center;gap:5px;
        }
        .arith-btn:hover{background:rgba(249,115,22,0.12);border-color:var(--coral);}
        .arith-btn.active{
            background:linear-gradient(135deg,var(--coral),var(--coral-dk));
            color:#fff;border-color:var(--coral);
            box-shadow:0 3px 10px rgba(249,115,22,0.3);
        }
        .arith-btn:disabled{opacity:0.3;cursor:not-allowed;}

        /* Temp warning */
        .tmp-warn{
            background:rgba(245,158,11,0.08);
            border:1px solid rgba(245,158,11,0.2);
            border-radius:8px;padding:6px 10px;
            font-size:11px;color:var(--warning);font-weight:600;
            display:none;margin-top:6px;
        }
        .tmp-warn.show{display:block;}

        /* Form card */
        .form-card{
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(12px);
            border:1px solid rgba(14,165,233,0.15);
            border-radius:var(--radius);
            padding:14px;flex:1;
            display:flex;flex-direction:column;gap:10px;
            box-shadow:0 4px 16px rgba(0,0,0,0.05);
        }

        .inputs-grid{
            display:grid;
            grid-template-columns:1fr auto 1fr;
            gap:10px;align-items:end;
        }
        .op-circle{
            width:32px;height:32px;
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            border-radius:50%;
            display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:13px;font-weight:700;
            box-shadow:0 3px 10px rgba(14,165,233,0.3);
            flex-shrink:0;margin-bottom:2px;
        }
        .inp-grp{display:flex;flex-direction:column;gap:4px;}
        .inp-grp label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
        .inp{
            width:100%;padding:8px 10px;
            background:#fff;
            border:1.5px solid rgba(14,165,233,0.18);
            border-radius:8px;
            font-family:'DM Sans',sans-serif;
            font-size:13px;font-weight:600;color:var(--text);
            outline:none;transition:var(--tr);
        }
        .inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,0.1);}
        .inp::placeholder{color:#94a3b8;font-weight:400;}
        select.inp{cursor:pointer;}
        select.inp option{background:#fff;color:var(--text);}

        .tgt-row{display:none;}
        .tgt-row.show{display:block;}
        .tgt-row label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px;}

        .run-btn{
            width:100%;padding:11px;
            background:linear-gradient(135deg,var(--accent),var(--accent-dk));
            color:#fff;border:none;border-radius:9px;
            font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
            cursor:pointer;transition:var(--tr);
            display:flex;align-items:center;justify-content:center;gap:8px;
            box-shadow:0 4px 14px rgba(14,165,233,0.3);
        }
        .run-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 18px rgba(14,165,233,0.4);}
        .run-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none;}

        /* ── Result — right below Run button ── */
        .inline-result{
            background:linear-gradient(135deg,rgba(14,165,233,0.05),rgba(14,165,233,0.02));
            border:1.5px solid rgba(14,165,233,0.2);
            border-radius:10px;padding:12px 14px;
            display:none;
        }
        .inline-result.show{display:block;}
        .ir-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
        .ir-ico{
            width:26px;height:26px;border-radius:50%;
            display:flex;align-items:center;justify-content:center;font-size:11px;
        }
        .ir-ico.ok {background:rgba(16,185,129,0.12);color:var(--green);border:1.5px solid rgba(16,185,129,0.3);}
        .ir-ico.err{background:rgba(239,68,68,0.12);color:var(--red);border:1.5px solid rgba(239,68,68,0.3);}
        .ir-ttl{font-size:11px;font-weight:700;color:var(--text);}
        .ir-sub{font-size:10px;color:var(--dim);font-weight:500;}
        .ir-val{font-size:26px;font-weight:700;}
        .ir-val.ok{color:var(--green);}
        .ir-val.err{color:var(--red);font-size:13px;font-weight:600;}
        .ir-meta{font-size:10px;color:var(--dim);margin-top:2px;font-weight:500;}

        /* ── Right column — history only ── */
        .right-col{display:flex;flex-direction:column;min-height:0;}

        .hist-card{
            background:rgba(255,255,255,0.85);
            backdrop-filter:blur(12px);
            border:1px solid rgba(14,165,233,0.15);
            border-radius:var(--radius);
            padding:12px 14px;
            flex:1;min-height:0;
            display:flex;flex-direction:column;
            box-shadow:0 4px 16px rgba(0,0,0,0.05);
        }
        .hist-hdr{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:8px;
        }
        .hist-hdr h3{
            font-size:12px;font-weight:700;
            display:flex;align-items:center;gap:5px;color:var(--text);
        }
        .hist-hdr h3 i{color:var(--accent);}
        .clr-btn{
            font-size:10px;color:var(--dim);font-weight:600;
            background:rgba(239,68,68,0.06);
            border:1px solid rgba(239,68,68,0.15);
            border-radius:6px;padding:3px 10px;
            cursor:pointer;font-family:'DM Sans',sans-serif;transition:var(--tr);
        }
        .clr-btn:hover{background:#ef4444;color:#fff;border-color:#ef4444;}
        .hist-empty{
            text-align:center;padding:24px 12px;
            color:var(--dim);font-size:11px;font-weight:500;
        }
        .hist-empty i{font-size:22px;display:block;margin-bottom:6px;opacity:0.25;}
        .hist-list{overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:5px;}
        .hist-item{
            background:rgba(14,165,233,0.04);
            border:1px solid rgba(14,165,233,0.1);
            border-radius:8px;padding:8px 10px;
            display:flex;justify-content:space-between;align-items:center;
        }
        .h-left{}
        .h-op{color:var(--accent-dk);font-weight:700;font-size:10px;text-transform:uppercase;margin-bottom:2px;}
        .h-det{color:var(--muted);font-size:11px;font-weight:500;}
        .h-res{font-weight:700;color:var(--green);font-size:14px;}
        .h-res.err{color:var(--red);font-size:10px;}

        .spin{
            display:inline-block;width:12px;height:12px;
            border:2px solid rgba(255,255,255,0.4);
            border-top-color:#fff;border-radius:50%;
            animation:spin 0.8s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sb-logo">
            <div class="sb-logo-icon"><i class="fas fa-ruler-combined"></i></div>
            <span class="sb-logo-txt">QMeasure</span>
        </div>
        <a class="s-item" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
        <a class="s-item" href="measurement.html?type=LENGTH"      id="nav-LENGTH"><i class="fas fa-ruler-horizontal"></i> Length</a>
        <a class="s-item" href="measurement.html?type=WEIGHT"      id="nav-WEIGHT"><i class="fas fa-weight-hanging"></i> Weight</a>
        <a class="s-item" href="measurement.html?type=VOLUME"      id="nav-VOLUME"><i class="fas fa-flask"></i> Volume</a>
        <a class="s-item" href="measurement.html?type=TEMPERATURE" id="nav-TEMPERATURE"><i class="fas fa-thermometer-half"></i> Temperature</a>
        <div class="s-div"></div>
        <div class="s-bottom">
            <div class="user-card">
                <div class="u-avatar" id="sideAvatar">N</div>
                <div class="u-name"   id="sideName">User</div>
                <div class="u-role"   id="sideRole">User</div>
                <div class="u-badge">● Active</div>
                <button class="logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </aside>

    <!-- Content -->
    <main class="content">

        <!-- Header -->
        <div class="pg-hdr">
            <h1>Measurement <span id="pgType">Operations</span></h1>
            <p>Select a type and action to perform operations via ASP.NET Core API</p>
        </div>

        <!-- Type row — sits above like a tab bar, same style as action buttons -->
        <div class="type-row">
            <button class="type-btn" onclick="setType('LENGTH')"      id="type-LENGTH">
                <i class="fas fa-ruler-horizontal"></i> Length
            </button>
            <button class="type-btn" onclick="setType('WEIGHT')"      id="type-WEIGHT">
                <i class="fas fa-weight-hanging"></i> Weight
            </button>
            <button class="type-btn" onclick="setType('VOLUME')"      id="type-VOLUME">
                <i class="fas fa-flask"></i> Volume
            </button>
            <button class="type-btn" onclick="setType('TEMPERATURE')" id="type-TEMPERATURE">
                <i class="fas fa-thermometer-half"></i> Temperature
            </button>
        </div>

        <!-- Main grid -->
        <div class="main-grid">

            <!-- Left: actions + form -->
            <div class="left-col">

                <!-- Action section -->
                <div class="action-section">
                    <div class="action-lbl">Choose Action</div>

                    <!-- Compare | Convert | Arithmetic — all same size -->
                    <div class="action-row">
                        <button class="a-btn" onclick="setAction('compare')" id="action-compare">
                            <i class="fas fa-equals"></i> Compare
                        </button>
                        <button class="a-btn" onclick="setAction('convert')" id="action-convert">
                            <i class="fas fa-exchange-alt"></i> Convert
                        </button>
                        <button class="arith-toggle" id="arithToggle" onclick="toggleArith()">
                            <i class="fas fa-calculator"></i> Arithmetic
                            <i class="fas fa-chevron-down" id="arithChev" style="font-size:9px;transition:transform 0.3s"></i>
                        </button>
                    </div>

                    <!-- Arithmetic sub-buttons — expand INLINE below, not dropdown -->
                    <div class="arith-sub" id="arithSub">
                        <button class="arith-btn" onclick="pickArith('add')"      id="action-add">
                            <i class="fas fa-plus"></i> Add
                        </button>
                        <button class="arith-btn" onclick="pickArith('subtract')" id="action-subtract">
                            <i class="fas fa-minus"></i> Subtract
                        </button>
                        <button class="arith-btn" onclick="pickArith('divide')"   id="action-divide">
                            <i class="fas fa-divide"></i> Divide
                        </button>
                    </div>

                    <div class="tmp-warn" id="tmpWarn">
                        ⚠ Temperature only supports <strong>Compare</strong> and <strong>Convert</strong>.
                    </div>
                </div>

                <!-- Form card -->
                <div class="form-card">
                    <div class="inputs-grid">
                        <div class="inp-grp">
                            <label id="lbl1">Value 1</label>
                            <input type="number" class="inp" id="val1" placeholder="0.0" step="any"/>
                            <select class="inp" id="unit1"></select>
                        </div>
                        <div class="op-circle" id="opCircle">?</div>
                        <div class="inp-grp">
                            <label id="lbl2">Value 2</label>
                            <input type="number" class="inp" id="val2" placeholder="0.0" step="any"/>
                            <select class="inp" id="unit2"></select>
                        </div>
                    </div>

                    <div class="tgt-row" id="tgtRow">
                        <label>Result Unit</label>
                        <select class="inp" id="tgtUnit"></select>
                    </div>

                    <button class="run-btn" id="runBtn" onclick="doOp()" disabled>
                        <span id="runTxt">Select type and action</span>
                    </button>

                    <!-- Result appears right here below Run button — no right card -->
                    <div class="inline-result" id="inlineResult">
                        <div class="ir-hdr">
                            <div class="ir-ico" id="irIco"><i class="fas fa-check"></i></div>
                            <div>
                                <div class="ir-ttl" id="irTtl">Result</div>
                                <div class="ir-sub" id="irSub"></div>
                            </div>
                        </div>
                        <div class="ir-val" id="irVal">—</div>
                        <div class="ir-meta" id="irMeta"></div>
                    </div>
                </div>
            </div>

            <!-- Right: history only — no duplicate result -->
            <div class="right-col">
                <div class="hist-card">
                    <div class="hist-hdr">
                        <h3><i class="fas fa-history"></i> Recent Operations</h3>
                        <button class="clr-btn" onclick="clearH()">Clear</button>
                    </div>
                    <div id="histEl" style="flex:1;min-height:0;display:flex;flex-direction:column;">
                        <div class="hist-empty">
                            <i class="fas fa-inbox"></i>
                            No operations yet.
                        </div>
                    </div>
                </div>
            </div>

        </div><!-- end main-grid -->
    </main>
</div>

<script>
const API = 'http://localhost:5000';
const UNITS = {
    LENGTH:['FEET','INCHES','YARDS','CENTIMETERS'],
    WEIGHT:['KILOGRAM','GRAM','POUND'],
    VOLUME:['LITRE','MILLILITRE','GALLON'],
    TEMPERATURE:['CELSIUS','FAHRENHEIT','KELVIN']
};
const TMAP={LENGTH:'LengthUnit',WEIGHT:'WeightUnit',VOLUME:'VolumeUnit',TEMPERATURE:'TemperatureUnit'};
const OPS ={compare:'=?',convert:'→',add:'+',subtract:'−',divide:'÷'};
const LBL2={compare:'Compare With',convert:'Target Unit',add:'Value 2',subtract:'Value 2',divide:'Value 2'};
let sType=null,sAction=null,hist=[],arithOpen=false;

window.onload=()=>{
    const token=localStorage.getItem('token');
    if(!token){window.location.href='index.html';return;}
    const fn=localStorage.getItem('fullName')||'User';
    const role=localStorage.getItem('role')||'User';
    const initials=fn.split(' ').map(n=>n[0]).join('').toUpperCase();
    document.getElementById('sideAvatar').textContent=initials;
    document.getElementById('sideName').textContent=fn;
    document.getElementById('sideRole').textContent=role;
    const t=new URLSearchParams(window.location.search).get('type');
    if(t&&UNITS[t]){
        setType(t);
        const nav=document.getElementById('nav-'+t);
        if(nav) nav.classList.add('active');
    }
    renderH();
};

function toggleArith(){
    arithOpen=!arithOpen;
    document.getElementById('arithSub').classList.toggle('open',arithOpen);
    document.getElementById('arithChev').style.transform=arithOpen?'rotate(180deg)':'';
    if(!arithOpen && ['add','subtract','divide'].includes(sAction)){
        // keep arith toggle highlighted if one is selected
    }
}

function pickArith(a){
    setAction(a);
    // keep panel open so user can see which is selected
}

function setType(t){
    sType=t;
    document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('type-'+t).classList.add('active');
    document.getElementById('pgType').textContent=t.charAt(0)+t.slice(1).toLowerCase();
    const units=UNITS[t];
    ['unit1','unit2','tgtUnit'].forEach(id=>{
        document.getElementById(id).innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join('');
    });
    const isTmp=t==='TEMPERATURE';
    document.getElementById('tmpWarn').classList.toggle('show',isTmp);
    ['add','subtract','divide'].forEach(a=>{
        document.getElementById('action-'+a).disabled=isTmp;
    });
    if(isTmp&&['add','subtract','divide'].includes(sAction)){
        sAction=null;
        document.querySelectorAll('.a-btn,.arith-btn').forEach(b=>b.classList.remove('active'));
        document.getElementById('arithToggle').classList.remove('active-group');
    }
    updBtn();
}

function setAction(a){
    if(!sType) return;
    sAction=a;
    // Clear all active states
    document.querySelectorAll('.a-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.arith-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById('arithToggle').classList.remove('active-group');

    if(['compare','convert'].includes(a)){
        document.getElementById('action-'+a).classList.add('active');
        // Close arith panel
        arithOpen=false;
        document.getElementById('arithSub').classList.remove('open');
        document.getElementById('arithChev').style.transform='';
    } else {
        // Arithmetic
        document.getElementById('action-'+a).classList.add('active');
        document.getElementById('arithToggle').classList.add('active-group');
    }
    document.getElementById('opCircle').textContent=OPS[a]||'?';
    document.getElementById('lbl2').textContent=LBL2[a];
    document.getElementById('tgtRow').classList.toggle('show',a==='add'||a==='subtract');
    updBtn();
}

function updBtn(){
    const btn=document.getElementById('runBtn');
    const txt=document.getElementById('runTxt');
    btn.disabled=!(sType&&sAction);
    txt.textContent=sType&&sAction
        ?`Run ${sAction.charAt(0).toUpperCase()+sAction.slice(1)}`
        :sType?'Select an action':'Select type and action';
}

async function doOp(){
    const token=localStorage.getItem('token');
    const v1=parseFloat(document.getElementById('val1').value)||0;
    const v2=parseFloat(document.getElementById('val2').value)||0;
    const u1=document.getElementById('unit1').value;
    const u2=document.getElementById('unit2').value;
    const tgt=document.getElementById('tgtUnit').value;
    const mt=TMAP[sType];
    let body={
        thisQuantity:{value:v1,unit:u1,measurementType:mt},
        thatQuantity:{value:v2,unit:u2,measurementType:mt}
    };
    if((sAction==='add'||sAction==='subtract')&&tgt)
        body.targetUnit={value:0,unit:tgt,measurementType:mt};

    const btn=document.getElementById('runBtn');
    const txt=document.getElementById('runTxt');
    btn.disabled=true;
    txt.innerHTML='<span class="spin"></span> Processing...';
    try{
        const res=await fetch(`${API}/measurements/${sAction}`,{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
            body:JSON.stringify(body)
        });
        const data=await res.json();
        if(res.ok){showRes(data,false);addH(data);}
        else showRes({result:data.message||'Operation failed',isError:true},true);
    }catch{
        showRes({result:'Cannot connect to API. Make sure ASP.NET Core is running on port 5000.',isError:true},true);
    }finally{
        btn.disabled=false;
        txt.textContent=`Run ${sAction.charAt(0).toUpperCase()+sAction.slice(1)}`;
    }
}

function showRes(data,isErr){
    const err=isErr||data.isError;
    const cls=err?'err':'ok';
    const ir=document.getElementById('inlineResult');
    ir.classList.add('show');
    document.getElementById('irIco').className=`ir-ico ${cls}`;
    document.getElementById('irIco').innerHTML=`<i class="fas fa-${err?'times':'check'}"></i>`;
    document.getElementById('irTtl').textContent=err?'Operation Failed':`${sAction.toUpperCase()} Result`;
    document.getElementById('irSub').textContent=err?(data.errorMessage||''):`${sType} · ${sAction}`;
    document.getElementById('irVal').className=`ir-val ${cls}`;
    document.getElementById('irVal').textContent=data.result||data.message||'—';
    document.getElementById('irMeta').textContent=!err&&data.operandOne?`${data.operandOne} ${OPS[sAction]} ${data.operandTwo}`:'';
}

function addH(data){
    hist.unshift({
        op:data.operation||sAction.toUpperCase(),
        type:data.measureType||sType,
        o1:data.operandOne||'—',o2:data.operandTwo||'—',
        result:data.result||'—',isErr:data.isError||false,err:data.errorMessage||''
    });
    if(hist.length>15)hist.pop();
    renderH();
}

function renderH(){
    const el=document.getElementById('histEl');
    if(!hist.length){
        el.innerHTML=`<div class="hist-empty"><i class="fas fa-inbox"></i>No operations yet.</div>`;
        return;
    }
    el.innerHTML=`<div class="hist-list">${hist.map(h=>`
        <div class="hist-item">
            <div class="h-left">
                <div class="h-op">${h.op} · ${h.type}</div>
                <div class="h-det">${h.o1} ${OPS[h.op.toLowerCase()]||''} ${h.o2}</div>
            </div>
            <div class="h-res ${h.isErr?'err':''}">${h.isErr?h.err:h.result}</div>
        </div>`).join('')}</div>`;
}

function clearH(){hist=[];renderH();}
function logout(){localStorage.clear();window.location.href='index.html';}
</script>
</body>
</html>
